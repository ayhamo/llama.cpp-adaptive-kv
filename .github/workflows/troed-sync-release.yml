# Fork-only workflow. Once a day it checks troed's fork of the adaptive KV streaming
# llama.cpp (MTP5 + ngram drafting on top of Raymond's V2). When troed has a commit
# this repo has not released yet, it builds his code as-is into the Windows CUDA
# llama-server for RTX 50 cards (sm_120) and publishes it here as a separate release,
# next to the Raymond builds from fork-sync-release.yml.
name: troed build and release

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and replace the release even if this troed commit exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: troed-sync-release
  cancel-in-progress: false

env:
  SOURCE_REPO: troed/llama.cpp-adaptive-kv-streaming
  SOURCE_BRANCH: fuss
  FA_QUANTS: "f16-f16;q8_0-q8_0;q8_0-q4_0;q8_0-q5_0;q5_0-q5_0;q5_0-q4_0;q5_1-q5_1;q4_0-q4_0"

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.ver.outputs.source_sha }}
      tag: ${{ steps.ver.outputs.tag }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - name: compare troed head with releases here
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$SOURCE_REPO/commits/$SOURCE_BRANCH" --jq .sha)
          tag="troed-${sha:0:12}"
          echo "troed head: $sha"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "$tag already released, nothing to do"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.source_sha }}

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.4'
          cuda_arch: x64

      - name: Install Ninja
        run: |
          choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=120 ^
            -DGGML_CUDA_FA_QUANTS="%FA_QUANTS%" ^
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DLLAMA_BUILD_BORINGSSL=ON
          if errorlevel 1 exit /b 1
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS% --target llama-server

      - name: Pack
        run: |
          $dst = '.\dist\llama-server-troed-win-cuda13-sm120'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item .\build\bin\*.exe, .\build\bin\*.dll $dst -ErrorAction SilentlyContinue
          robocopy "${{ env.CUDA_PATH }}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "${{ env.CUDA_PATH }}\bin\x64" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          Copy-Item .\benchmarks\find-max-arena.py $dst -ErrorAction SilentlyContinue
          "${{ needs.check.outputs.source_sha }}" | Out-File "$dst\COMMIT.txt"
          if (-not (Test-Path "$dst\llama-server.exe")) { throw "llama-server.exe missing" }
          Compress-Archive -Path "$dst\*" -DestinationPath ".\dist\llama-server-troed-win-cuda13-sm120.zip"
          exit 0

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ needs.check.outputs.source_sha }}"
          subject=$(gh api "repos/$SOURCE_REPO/commits/$sha" --jq '.commit.message | split("\n")[0]')
          date=$(gh api "repos/$SOURCE_REPO/commits/$sha" --jq '.commit.committer.date[0:10]')
          gh release create "${{ needs.check.outputs.tag }}" dist/llama-server-troed-win-cuda13-sm120.zip \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "llama-server troed fork ($date, ${sha:0:12})" \
            --notes "Windows CUDA 13.4 build of troed's adaptive KV streaming fork (MTP5 + ngram drafting), for RTX 50 cards (sm_120).
          Static build: unzip into its own folder; it needs only the NVIDIA driver.

          Source commit: https://github.com/$SOURCE_REPO/commit/$sha
          Source change: $subject"
